[build-system]
# Pinned to <69.0 per CB-9481010-8A0A for supply chain safety under stdlib-only policy.
# Unpinned major versions risk breaking changes or malicious updates affecting build reproducibility.
# Range chosen after testing compatibility with setuptools 68.x series.
requires = ["setuptools==68.2.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "codebot"
version = "0.2.0"
description = "Portable autonomous software engineering platform"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest==7.4.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
include = ["codebot*"]
