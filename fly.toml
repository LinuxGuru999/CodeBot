app = "codebot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CODEBOT_PROJECT_ROOT = "/project"
  GITHUB_DRY_RUN = "0"
  # 1GB Fly profile for 20 concurrent bots: 20 x ~31MB RSS ~= 620MB
  # plus orchestrator (~30MB) + control_server (~30MB), leaving ~300MB headroom.
  CODEBOT_MAX_CONCURRENT = "22"
  CODEBOT_MAX_IMPLEMENTERS = "12"
  CODEBOT_MAX_NON_IMPLEMENTERS = "6"
  CODEBOT_MAX_DISCOVERY = "6"
  CODEBOT_MAX_REVIEWERS = "6"
  CODEBOT_MAX_THINKING_CONCURRENT = "4"
  CODEBOT_MAX_QWEN_38 = "4"
  CODEBOT_MAX_EXPENSIVE_CONCURRENT = "4"
  CODEBOT_MIN_SPAWN_GAP = "8"
  CODEBOT_RATE_LIMIT_REQUEUE_S = "600"
  CODEBOT_MIN_MEMORY_MB = "60"
  CODEBOT_METRICS_EVERY_TICKS = "8"

[http_service]
  internal_port = 8081
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "codebot_data"
  destination = "/data"
  initial_size = "3gb"
