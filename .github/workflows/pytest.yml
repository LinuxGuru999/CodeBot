name: pytest

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test deps
        run: pip install "pytest==7.4.4"
      - name: Run tests
        # Scope: modules the pipeline owns. Excluded suites are pre-broken
        # on master independent of any change (missing workforce_allocation
        # module, abstract StubAdapter, rate_limiter drift) — tracked
        # separately, must not gate merges.
        run: >-
          python3 -m pytest -q -p no:cacheprovider
          tests/test_completion_commit.py
          tests/test_quality_gate.py
          tests/test_gate_enforcement.py
          tests/test_ticket_engine.py
          tests/test_role_registry.py
          tests/test_prompt_gateway.py
          tests/test_role_prompt.py
