name: pytest

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install test deps
        run: pip install "pytest==7.4.4"
      - name: Run tests
        run: python3 -m pytest -q -p no:cacheprovider --ignore=tests/load_tests -m "not slow" --deselect tests/test_adaptive_rate_limiter.py
