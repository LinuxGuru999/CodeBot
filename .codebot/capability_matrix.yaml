# CodeBot Capability Matrix (ROADMAP §85.B)
#
# Machine-readable record of what CodeBot can actually do.
# Statuses are grounded in source + tests, not documentation claims.
# Agents MUST consult this matrix before claiming a capability.
#
# Status vocabulary:
#   EXISTS            - implemented and verified by tests
#   PARTIALLY_EXISTS  - implemented but with verified limitations
#   PLANNED           - designed in ROADMAP, not yet implemented
#   MISSING           - no implementation exists
#
# Last audited: 2026-09-18 (direct source inspection, 63 modules, 54 test files, 28 roles)

schema_version: "1.0"

