    agents: [ticket_triager]
    quality_gates: []
    roadmap_id: "2.D"
    limitations: >
      14-state machine with SHA-256 dedup verified. Concurrent agent changes
      introduced a PLANNING prerequisite whose tests were failing at audit time;
      see test_ticket_engine.py failures before relying on transition behavior.

