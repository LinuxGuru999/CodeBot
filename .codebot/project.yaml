# CodeBot Project Contract
# CodeBot manages its own codebase under strengthened safeguards (Constitution §10).
#
# Schema version: 1.0
# Last updated: 2026-09-18

schema_version: "1.0"

project:
  name: "codebot"
  display_name: "CodeBot"
  description: "Autonomous software engineering platform managing its own codebase."
  repository_root: "."
  primary_language: "python"
  languages:
    - python
  python_version: "3.14.7"

architecture:
  style: "monorepo"
  components:
    - name: "core"
      path: "codebot/"
      type: "backend"
      language: "python"
      description: "All portable CodeBot modules (orchestrator, api_runner, ticket_engine, etc.)"
    - name: "tests"
      path: "tests/"
      type: "test"
      language: "python"
      description: "Unit and integration tests"
    - name: "docs"
      path: "docs/"
      type: "documentation"
      language: "markdown"
      description: "Architecture, API, deployment docs, gap analysis, goals"
    - name: "roles"
      path: "codebot/roles/"
      type: "configuration"
      language: "markdown"
      description: "Agent role prompt templates (26 roles)"

testing:
  framework: "pytest"
  test_command: "python3 -m pytest -q"
  test_directories:
    - "tests/"
  coverage_tool: "pytest-cov"
  lint_tool: "none"
  type_checker: "none"
  type_check_command: ""

dependencies:
  policy: "stdlib-only"
  allowed_third_party:
    - name: "pytest"
      scope: "dev"
      justification: "Test runner"
    - name: "pytest-cov"
      scope: "dev"
      justification: "Coverage measurement"
  dependency_files:
    - "pyproject.toml"

paths:
  state_dir: ".codebot/state/"
  logs_dir: "logs/"
  docs_dir: "docs/"
  issues_dir: "docs/issues/"
  modules_docs_dir: "docs/modules/"
  adr_dir: "docs/adr/"
  api_contract: ".codebot/api/contract.md"
  entrypoint: "ENTRYPOINT.md"
  context_map: ".codebot/CONTEXT-MAP.md"
  bugs_file: "docs/bugs.md"
  features_file: "docs/features.md"
  roadmap_file: "docs/GOALS.md"
  queue_file: "docs/QUEUE.md"

security:
  ssrf_protection: true
  bearer_token_auth: false
  password_hashing: "none"
  rate_limiting: true
  security_headers: false
  blocklist_validation: true
  tls_verification_default: true

autonomy:
  level: 3
  escalation_model: "qa_recommendations"
  qa_recommendation_required_for:
    - "authentication_architecture"
    - "authorization_boundaries"
    - "cryptography"
    - "destructive_migrations"
    - "secrets"
    - "security_policy_relaxation"
    - "constitution_changes"
    - "major_architecture_changes"
    - "self_improvement_controls"
    - "orchestrator_modifications"
    - "gatekeeper_weakening"
  autonomous_allowed_for:
    - "documentation_corrections"
    - "test_additions"
    - "safe_refactors"
    - "known_bug_fixes"
    - "role_prompt_improvements"
    - "coverage_improvements"
