# CodeBot Quality Gate Policy
# Defines required and conditional verification gates for ticket completion.
# Per CODEBOT-ROADMAP.md §5: no ticket reaches COMPLETE without passing these.
#
# Gate execution: exit code 0 = PASS, non-zero = FAIL.
# Gates with `required: false` are advisory — they log results but do not
# block the REVIEW→COMPLETE transition. Use this for checks that require
# tooling not always available (Playwright, axe-core) or human judgment.

required:
  - name: build
    command: "python3 -m py_compile {file}"
  - name: unit_tests
    command: "python3 -m pytest -q {test_dirs}"

conditional:
  security_boundary:
    - name: security_review_verdict
      command: "python3 scripts/gate_checks.py reviewer_verdict {ticket_id} security_reviewer {state_dir}"
    - name: adversarial_test
      command: "python3 -m pytest -q -k security {test_dirs}"

  api_change:
    - name: contract_tests
      command: "python3 -m pytest -q -k contract {test_dirs}"

  data_migration:
    - name: migration_test
      command: "python3 -m pytest -q -k migration {test_dirs}"
    - name: rollback_test
      command: "python3 -m pytest -q -k rollback {test_dirs}"

  performance_sensitive:
    - name: benchmark
      command: "python3 -m pytest -q -k benchmark {test_dirs}"

  documentation_impact:
    - name: documentation_review
      command: "python3 scripts/gate_checks.py docs_changed {changed_files}"
      required: false

  frontend_change:
    - name: ui_review_verdict
      command: "python3 scripts/gate_checks.py reviewer_verdict {ticket_id} ux_reviewer {state_dir}"
      required: false
    - name: responsive_test
      command: "python3 -m pytest -q -k responsive {test_dirs}"
    - name: visual_regression
      command: "python3 -m pytest -q -k visual {test_dirs}"
      required: false

  accessibility_scan:
    - name: a11y_check
      command: "python3 -m pytest -q -k a11y {test_dirs}"
      required: false

  e2e_browser:
    - name: browser_e2e
      command: "python3 -m pytest -q -k e2e {test_dirs}"
      required: false

  deployment_smoke:
    - name: smoke_test
      command: "python3 scripts/gate_checks.py smoke_import {changed_files}"

  auth_security_review:
    - name: auth_review_verdict
      command: "python3 scripts/gate_checks.py reviewer_verdict {ticket_id} security_reviewer {state_dir}"

  tenant_scope_change:
    - name: isolation_tests
      command: "python3 -m pytest -q -k tenant_isolation {test_dirs}"

  performance_budget:
    - name: budget_check
      command: "python3 -m pytest -q -k performance {test_dirs}"
      required: false
